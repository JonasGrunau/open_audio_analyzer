name: bel
description: "Bel — a free and open-source loudness and spectrum analyzer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The domain model. Pure Dart, MIT, and deliberately unaware that an engine
  # exists — see packages/bel_core/lib/bel_core.dart.
  bel_core:
    path: packages/bel_core

  # The measurement engine and its build hook. MIT.
  bel_engine:
    path: packages/bel_engine

  # Tokens and the primitives every module is built from. GPL, like the app.
  bel_ui:
    path: packages/bel_ui

  # Configuration and UI state only. Measurements never pass through it: they
  # go from native memory to a CustomPainter without touching the widget tree,
  # which is the entire reason this app can hold a frame budget with a dozen
  # meters live.
  flutter_riverpod: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Declared here rather than in bel_ui, which is where the type styles that use
  # them live. A package's fonts have to be referenced as
  # `TextStyle(fontFamily: 'Inter', package: 'bel_ui')`, and that constructor
  # argument rewrites `fontFamilyFallback` as well — turning the system
  # fallbacks in BelType into 'packages/bel_ui/Menlo' and similar paths that do
  # not exist. Bundling from the application keeps both lists honest.
  #
  # Both families are SIL OFL 1.1; their licence files sit beside them and must
  # ship with any binary. Only the weights BelType actually names are included.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
