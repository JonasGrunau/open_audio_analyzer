name: oaa
description: "Open Audio Analyzer — a free and open-source loudness and spectrum analyzer."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The domain model. Pure Dart, MIT, and deliberately unaware that an engine
  # exists — see packages/oaa_core/lib/oaa_core.dart.
  oaa_core:
    path: packages/oaa_core

  # The measurement engine and its build hook. MIT.
  oaa_engine:
    path: packages/oaa_engine

  # Tokens and the primitives every module is built from. GPL, like the app.
  oaa_ui:
    path: packages/oaa_ui

  # The remote display's protocol. MIT, pure Dart, and used by both ends of the
  # link — this binary is the host on a desktop and the display on a tablet.
  oaa_wire:
    path: packages/oaa_wire

  # Configuration and UI state only. Measurements never pass through it: they
  # go from native memory to a CustomPainter without touching the widget tree,
  # which is the entire reason this app can hold a frame budget with a dozen
  # meters live.
  flutter_riverpod: ^3.0.0
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Declared here rather than in oaa_ui, which is where the type styles that use
  # them live. A package's fonts have to be referenced as
  # `TextStyle(fontFamily: 'Inter', package: 'oaa_ui')`, and that constructor
  # argument rewrites `fontFamilyFallback` as well — turning the system
  # fallbacks in OaaType into 'packages/oaa_ui/Menlo' and similar paths that do
  # not exist. Bundling from the application keeps both lists honest.
  #
  # Both families are SIL OFL 1.1; their licence files sit beside them and must
  # ship with any binary. Only the weights OaaType actually names are included.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Google Sans Code
      fonts:
        - asset: assets/fonts/GoogleSansCode-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansCode-Medium.ttf
          weight: 500
