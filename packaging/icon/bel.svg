<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPDX-License-Identifier: GPL-3.0-or-later

  Bel's mark, as a vector. The same geometry as `_Mark` in make_icons.dart, and
  the only place in this repository where the same shape is described twice.
  It is not generated from that file because the one consumer — Linux's
  `scalable` hicolor directory — wants a vector, and writing an SVG emitter to
  avoid twenty lines of hand-written path data would be the more expensive
  duplicate.

  Every number below is derived from the unit values in make_icons.dart on a
  1024 canvas:

      inset 0.2      ->  204.8 on each side, drawable 204.8 .. 819.2
      corner 0.2     ->  radius 204.8
      edge 0.012     ->  stroke 12.288, drawn inside the rounded square
      bars, 4, 2:1   ->  unit 55.8545, bar 111.709, pitch 167.5636
      heights        ->  0.34 0.55 0.74 1.00 of 614.4
      cap 0.22       ->  135.168 of the tallest bar, from its top

  If the mark changes, change it there first and bring these across.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Bel</title>

  <!-- The tile: graphite, with a hairline so it has an edge on a pale desktop. -->
  <rect x="6.144" y="6.144" width="1011.712" height="1011.712" rx="198.656"
        fill="#0B0C0E" stroke="#2E343C" stroke-width="12.288"/>

  <!-- Four bars, rising. -->
  <g fill="#35E0C4">
    <rect x="204.800" y="610.304" width="111.709" height="208.896"/>
    <rect x="372.364" y="481.280" width="111.709" height="337.920"/>
    <rect x="539.927" y="364.544" width="111.709" height="454.656"/>
    <rect x="707.491" y="204.800" width="111.709" height="614.400"/>
  </g>

  <!-- and the tallest one is over. -->
  <rect x="707.491" y="204.800" width="111.709" height="135.168" fill="#FF4D4D"/>
</svg>
