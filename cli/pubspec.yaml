name: oaa_cli
description: "The `oaa` command-line loudness analyser."
publish_to: 'none'
version: 0.9.0

# GPL-3.0-or-later, like the app. The engine it calls is MIT and stays that
# way — see the licensing split in README.md.

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.6.0

  # The report model and its three export formats. Pure Dart, so the CLI needs
  # no Flutter binding of any kind.
  oaa_core:
    path: ../packages/oaa_core

  # The engine and its build hook. `dart run` and `dart compile exe` both drive
  # hook/build.dart, so there is no separate native build step for the CLI.
  oaa_engine:
    path: ../packages/oaa_engine

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  oaa: oaa
