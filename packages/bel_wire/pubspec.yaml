name: bel_wire
description: >-
  The Bel wire protocol: framing, and the codec that puts one published
  measurement on a socket. Pure Dart — no Flutter, no dart:ffi, no I/O.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  # For MeterSource, which the decoder implements and the encoder reads. Nothing
  # else — in particular not bel_engine: the remote display decodes these frames
  # on a tablet that has no engine, and a codec that dragged a native library in
  # would make that impossible.
  bel_core:
    path: ../bel_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
