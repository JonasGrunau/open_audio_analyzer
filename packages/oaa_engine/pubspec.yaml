name: oaa_engine
description: >-
  Dart bindings for the Open Audio Analyzer measurement engine. Compiles the C in engine/ via a
  build hook and exposes its snapshot as zero-copy typed views.
version: 0.2.0
publish_to: 'none' # Depends on ../../engine, which no published archive contains.

environment:
  sdk: ^3.12.2

dependencies:
  # For MeterSource only — the interface OaaEngine declares it satisfies, so
  # that a module can be written once and drawn from either a local engine or a
  # remote display's socket. oaa_core is pure Dart with no dependencies of its
  # own, so this costs nothing at build or link time, and the arrow points this
  # way rather than the other: oaa_core still knows nothing about dart:ffi.
  oaa_core:
    path: ../oaa_core

  code_assets: ^1.0.0
  # Needed at runtime, not just for codegen: oaa_version_string returns a
  # Pointer<Char> and Utf8 conversion lives here.
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
