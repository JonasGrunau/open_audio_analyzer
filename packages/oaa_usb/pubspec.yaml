name: oaa_usb
description: >-
  The Android Open Accessory protocol, desktop side, over a vendored libusb. Turns an Android
  tablet on a cable into a byte stream with no USB debugging.
version: 0.1.0
publish_to: 'none' # Workspace package, like oaa_engine.

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
