# SPDX-License-Identifier: GPL-3.0-or-later
#
# One workflow: is this correct, does the site build, can somebody install it.
#
# ---------------------------------------------------------------------------
# Why this is one file and not three
#
# It was three — `ci.yml`, `docs.yml`, `release.yml` — split on the argument
# that packaging is an order of magnitude slower than testing and must not slow
# the signal everybody waits on. That argument was right about the cost and
# wrong about the remedy: what keeps the common push fast is *not running* the
# packaging jobs, and that is an `if:` condition, not a separate file. Splitting
# by file bought nothing and cost three things.
#
# It cost clarity. A push produced two runs and a tag produced a third, none of
# which named the others, so "did this commit pass" meant reading two pages.
#
# It cost the gate that matters most. A tag could publish a release from a
# commit whose tests were red, because `release.yml` had no way to depend on a
# job in `ci.yml`. It cannot now: `publish` needs every test job by name.
#
# And it cost the packaging paths any coverage at all. `release.yml` ran for the
# first time on the v0.2.0 tag, months after it was written, and four of its six
# jobs failed — `dart compile exe` had stopped supporting build hooks, the msix
# manifest had a display name where an identifier goes, and `flatpak install`
# was waiting for an answer to a question nobody could hear. Every one of those
# was a first execution. They are gated here rather than absent, and
# `workflow_dispatch` runs the whole thing on demand for exactly that reason.
#
# What runs when:
#
#   pull request        checks, engine, the website build
#   push to main        the same, plus the website deploy
#   workflow_dispatch   the same, plus the plugin, every installer, the ipa
#                       and the Android bundle — unless `asc_notes_build` names
#                       a build, which makes it a notes run and skips all of
#                       those, because the point of that run is to be cheap
#   tag v*              the same, plus publish, then testflight and play-store
#
# The plugin is on the release side of that line with the installers: three
# parallel JUCE builds is the most expensive thing here by an order of
# magnitude. What that costs is written above the job.
#
# `testflight` and `play-store` are the only jobs that run *after* `publish`
# rather than before it, and that is deliberate. Neither upload can be taken
# back, so each happens once the release exists — never leaving a store build
# for a version that was never published. Play is the stricter of the two: a
# version code it has accepted can never be reused or lowered, so an upload
# that ran ahead of a release that then failed would burn the number the retry
# wanted. Both artefacts are built alongside the other packagers, in `ipa` and
# `android-aab`, so a signing failure fails the release instead of following
# it.
#
# ---------------------------------------------------------------------------
# The AppImage runner is deliberately old
#
# glibc is forward-compatible and not backward-compatible, so an AppImage built
# against a newer one refuses to start on an older distribution — with a loader
# error and nothing else. `ubuntu-22.04` is therefore pinned rather than
# `ubuntu-latest`, and moving it forward silently narrows who can run Open Audio
# Analyzer. The flatpak has no such constraint because its runtime carries its
# own libc, which is most of the reason to have both.
#
# ---------------------------------------------------------------------------
# Unsigned artefacts are published, and labelled
#
# Signing needs secrets a fork does not have. Rather than fail, each script
# produces an unsigned package and says so on stdout; the release notes repeat
# it. A build that quietly published something a user cannot install would be
# worse than one that failed.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      asc_notes_build:
        description: >-
          App Store Connect build number to write the store notes onto, and
          nothing else. For checking that path without spending an upload —
          see the asc-notes job. Empty runs the ordinary manual build.
        required: false
        default: ''

# Pinned to the same version as .tool-versions. Keep the two in step; a CI that
# passes on a different Flutter than everybody develops against is worse than
# no CI.
env:
  FLUTTER_VERSION: 3.44.5
  # And the JDK, for the same reason and from the same file. `.tool-versions`
  # says `java temurin-25.0.1+8.0.LTS`; only the major version is meaningful to
  # `setup-java`, and only the Android jobs need a JDK at all.
  JAVA_VERSION: '25'

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Correctness. Everything here runs on every event.
  # -------------------------------------------------------------------------

  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Domain tests
        working-directory: packages/oaa_core
        run: |
          dart pub get
          dart test

      # The remote display's protocol, including the golden that holds this
      # implementation against the C++ producer byte for byte. Pure Dart, so it
      # runs beside the domain tests and needs no toolchain — three
      # implementations of docs/WIRE.md agreeing is the entire point of having
      # written it down. The C++ end of that agreement is checked in `plugin`,
      # which only runs on a release — so between releases this is one-sided.
      - name: Wire protocol tests
        working-directory: packages/oaa_wire
        run: |
          dart pub get
          dart test

      # The website's fourth MeterSource. It is here rather than in `website`
      # because that job runs `npm` and nothing else — no Flutter, no Dart —
      # and this needs neither: `oaa_replay` depends on `oaa_core` alone.
      #
      # What it pins is the scope window, which is the one thing that source
      # synthesises rather than replays, and the one thing no other gate can
      # see: `flutter analyze` does not reach into `website/tools/`, the site
      # builds without a toolchain, and the demo's own photograph is committed.
      # A window a block wide against a reader owed four blocks' worth put a
      # comb where the front page's waveform should be, and it stood in the
      # published still for a week.
      - name: Replay source tests
        working-directory: website/tools/oaa_replay
        run: |
          dart pub get
          dart test

      # The engine has two build descriptions — hook/build.dart for the app and
      # engine/CMakeLists.txt for the plugin — and somebody adding a source file
      # will eventually add it to one. The failure that produces is an undefined
      # symbol at link time in whichever consumer was forgotten, usually on a
      # platform the author was not building. This turns it into a one-line diff.
      - name: Engine source lists agree
        run: sh plugin/test/sources_match.sh

      # The C++ that needs no framework, on every push.
      #
      # `-DOAA_BUILD_PLUGIN=OFF` configures `plugin/` with no JUCE at all: no
      # fetch, no framework compile, no plugin, no fake DAW. What is left is
      # liboaa, the wire fixture and the transport box's
      # delivered-exactly-once test — a second to configure, three to build and
      # under one to run, against roughly ten minutes for a plugin build. That
      # ratio is why the `plugin` job stays gated to a release while this does
      # not.
      #
      # It exists because of a defect it would have caught: the transport box
      # was delivering one relocate twice, and the test that now pins it could
      # only run on a release or a manual dispatch — behind a JUCE build it does
      # not need.
      #
      # `engine_sources_match` is registered in this `ctest` as well as in the
      # step above. The overlap is deliberate: that step needs no CMake, and
      # this one needs no second invocation.
      - name: Plugin C++ tests, without JUCE
        run: |
          cmake -B plugin/build-nojuce -S plugin \
            -DCMAKE_BUILD_TYPE=Release -DOAA_BUILD_PLUGIN=OFF
          cmake --build plugin/build-nojuce
          ctest --test-dir plugin/build-nojuce --output-on-failure

      - name: Widget tests
        run: flutter test

  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Compiles engine/src through hook/build.dart and exercises the meters
      # against the test tone. A sine of amplitude A peaks at A and has an RMS
      # of A/sqrt(2) — if those drift, the meters are wrong, not the tone.
      # Includes the EBU Tech 3341/3342 conformance cases. A red conformance
      # run is a red build: these numbers are what users deliver against.
      - name: Engine and conformance tests
        working-directory: packages/oaa_engine
        run: |
          dart pub get
          dart test

      # Runs the real `oaa` binary as a subprocess and asserts on its exit
      # codes. On all three platforms because file decoding is where they
      # differ most: Windows takes a UTF-16 path, and a filename with an umlaut
      # in it fails there and nowhere else.
      - name: CLI tests
        working-directory: cli
        run: |
          dart pub get
          dart test

      # `cli/test` runs the CLI with `dart run`, so nothing here built it the
      # way a release does until this step existed — and `dart compile exe`
      # had stopped working entirely, because it refuses a package with build
      # hooks and `oaa_engine` has one. That was found by tagging 0.2.0 and
      # watching all three CLI jobs fail. The build is the gate; running the
      # result is what proves the bundle's layout, since the executable loads
      # the engine from the library beside it.
      - name: CLI builds and starts
        working-directory: cli
        run: dart build cli -o build

      - name: CLI builds and starts (run)
        if: runner.os != 'Windows'
        working-directory: cli
        run: ./build/bundle/bin/oaa --version

      - name: CLI builds and starts (run)
        if: runner.os == 'Windows'
        working-directory: cli
        run: .\build\bundle\bin\oaa.exe --version

  # -------------------------------------------------------------------------
  # The plugin — a release, or a manual run
  #
  # Nothing compiled `plugin/` until this job existed. CI ran
  # `plugin/test/sources_match.sh`, which compares two text files and never
  # invokes CMake, so the VST3 and the AU were built by whoever last did it by
  # hand — with a JUCE dependency fetched by tag, a C++ producer that must
  # agree with `packages/oaa_wire` byte for byte, and a `VERSION` that moves
  # every release.
  #
  # It is gated with the installers rather than run on every push, because
  # three parallel JUCE builds is the most expensive thing in this file by an
  # order of magnitude and a push does not ask the question. **The cost is that
  # `ctest` moves with it,** and that run is the producing half of the wire
  # golden: `checks` asserts that the committed goldens decode, and only this
  # job asserts that `plugin/src/OaaWire.cpp` still writes `wire_v3.bin`. Between
  # releases, that agreement is checked from one side. Building only the
  # `oaa_wire_fixture` target would restore it cheaply — it needs the engine
  # and one translation unit, not JUCE — and would need CMakeLists.txt to make
  # the JUCE fetch conditional, which it does not today.
  #
  # AU is macOS-only and JUCE decides that, not this file: `plugin/CMakeLists.txt`
  # appends it to OAA_FORMATS `if(APPLE)`. VST3 builds on all three.
  # -------------------------------------------------------------------------

  plugin:
    name: Plugin (${{ matrix.os }})
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 and not latest, for the reason the AppImage job is
        # pinned: a binary built against a newer glibc does not start on an
        # older one, it reports a version mismatch and nothing else. The
        # difference here is that nobody sees even that — a VST3 the loader
        # refuses is a plug-in absent from the DAW's browser, which is what
        # having installed it in the wrong folder also looks like. This leg
        # ran on ubuntu-latest for six releases while the AppImage beside it
        # was pinned, so the Linux app and the Linux plug-in shipped with
        # different floors and only one of them was deliberate.
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # JUCE's Linux build wants X11, Xrandr, Xinerama, Xcursor, freetype and
      # GL even for a plugin that draws almost nothing, and libasound for the
      # audio device layer. JUCE_WEB_BROWSER=0 and JUCE_USE_CURL=0 in
      # CMakeLists.txt are what keep webkit2gtk and libcurl off this list.
      - name: Toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      # Keyed on the file that pins the tag rather than on the tag copied into
      # this workflow. `OAA_JUCE_TAG` lives in plugin/CMakeLists.txt and there
      # is no second place for it to disagree with; the cost is re-cloning JUCE
      # when something unrelated in that file changes, which is a shallow clone.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      # A runner is a machine with an empty keychain, so the identity the build
      # is about to hand `codesign` has to be put into one first. This step is
      # the half that was missing for three releases: the workflow read an
      # OAA_SIGNING_IDENTITY secret and passed the *name* of a certificate that
      # was never anywhere on the machine. With no secret set it imports
      # nothing and says so, and the build below ad-hoc signs exactly as it has
      # always done.
      - name: Signing certificate
        if: runner.os == 'macOS'
        env:
          OAA_SIGNING_CERTIFICATE: ${{ secrets.OAA_SIGNING_CERTIFICATE }}
          OAA_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OAA_SIGNING_CERTIFICATE_PASSWORD }}
        run: sh packaging/macos/keychain.sh

      # The identity is a configure-time variable rather than an environment
      # one, because the target that reads it is generated at configure time.
      # It is declared on all three platforms and defaults to "-", so one line
      # serves every runner and nothing warns about a variable it did not read.
      - name: Configure
        run: cmake -B plugin/build -S plugin -DCMAKE_BUILD_TYPE=Release -DOAA_CODESIGN_IDENTITY="${{ secrets.OAA_SIGNING_IDENTITY || '-' }}"

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build plugin/build

      - name: Build
        if: runner.os == 'Windows'
        run: cmake --build plugin/build --config Release

      # The wire golden, from the producing side. `packages/oaa_wire` asserts
      # that the committed goldens decode; this asserts that the C++ in
      # `plugin/src/OaaWire.cpp` still writes `wire_v3.bin`. Neither test is worth much
      # without the other, and only one of them was running.
      - name: Tests
        run: ctest --test-dir plugin/build --output-on-failure -C Release

      # Xvfb, because the fake DAW is a JUCE GUI application even when it is
      # asked not to open a window, and JUCE's initialisation on Linux wants a
      # display. `--headless` needs no sound card, which is the part a runner
      # genuinely cannot provide.
      - name: Display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - uses: dart-lang/setup-dart@v1

      # The end to end, and the only place it runs.
      #
      # `checks` runs this same suite and the end-to-end cases skip there,
      # because they need a built plugin and a built fake DAW and that job has
      # neither. Here both exist, so `plugin/host/`'s `oaa-fake-daw --headless`
      # plays a generated signal through the VST3 and the Dart codec decodes
      # what comes back off the socket. Everything between `prepareToPlay` and
      # the socket is covered by this and by nothing else — the byte-for-byte
      # golden above is produced by a fixture that links no JUCE at all.
      #
      # No Flutter, and no downloaded audio: the test writes its own WAV. A gate
      # that fetches music from a public archive fails for reasons that have
      # nothing to do with this repository.
      - name: End to end
        working-directory: packages/oaa_wire
        run: |
          dart pub get
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} dart test

      # The other hop, and the only place *it* runs: the same fake DAW, with the
      # application's ingest and its display host in between, and a
      # `DisplayClient` on the far end standing in for a tablet.
      #
      # It needs Flutter, which is why it is one runner rather than three: what
      # it covers is the app re-encoding a snapshot it decoded, which is Dart
      # over loopback and identical on every platform. What varies per OS is the
      # plugin build, and the step above already exercises that on all three.
      #
      # One file rather than `flutter test`, because `checks` has already run
      # the suite — this case skipped there, for want of a built plugin.
      - name: Relay to a display
        if: runner.os == 'Linux'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Relay end to end
        if: runner.os == 'Linux'
        run: |
          flutter pub get
          xvfb-run -a flutter test test/plugin_to_display_e2e_test.dart

      # After the build because a bundle has to be signed before Apple will
      # notarise it, and before the Archive because the ticket that stapling
      # writes is a *file inside the bundle* — an archive made first would not
      # contain it, and the download would be refused exactly as an
      # unnotarised one is. Without credentials this prints what that costs and
      # succeeds, so a fork's release still produces artefacts.
      - name: Notarise
        if: runner.os == 'macOS'
        env:
          OAA_NOTARY_APPLE_ID: ${{ secrets.OAA_NOTARY_APPLE_ID }}
          OAA_NOTARY_TEAM_ID: ${{ secrets.OAA_NOTARY_TEAM_ID }}
          OAA_NOTARY_PASSWORD: ${{ secrets.OAA_NOTARY_PASSWORD }}
        run: |
          cd plugin/build/OaaPlugin_artefacts/Release
          set -- VST3/*.vst3
          if [ -d AU ]; then set -- "$@" AU/*.component; fi
          sh "$GITHUB_WORKSPACE/packaging/macos/notarize.sh" "$@"

      # VST3 everywhere, AU where JUCE built one. Standalone is deliberately
      # left out: it is a window around a plugin whose whole purpose is to
      # stream to an application that is already running.
      - name: Archive
        if: runner.os != 'Windows'
        run: |
          cd plugin/build/OaaPlugin_artefacts/Release
          formats=VST3
          [ -d AU ] && formats="$formats AU"
          echo "archiving: $formats"
          tar -czf "$GITHUB_WORKSPACE/oaa-plugin-${{ runner.os }}.tar.gz" $formats

      # The bundle, not the directory holding it. MSVC leaves an import library
      # and an export file beside the .vst3 — `Open Audio Analyzer.lib` and
      # `.exp` — and archiving the parent shipped both to anyone who downloaded
      # the plugin. A DAW ignores them; a person copying `VST3\*` into their
      # plugin folder does not know that.
      - name: Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'plugin\build\OaaPlugin_artefacts\Release\VST3\*.vst3' `
            -DestinationPath oaa-plugin-Windows.zip

      # `runner.os` and not `matrix.os`, so the artefact is named for the
      # platform rather than for the runner image: `oaa-plugin-Linux` and not
      # `oaa-plugin-ubuntu-22.04`. Three installer jobs download this by name
      # and the image above is pinned, so moving that pin would have broken
      # three downloads in jobs nobody touched — on a release, a fortnight
      # later. It also matches the filename inside the archive, which is what
      # a person unpacking it sees.
      - uses: actions/upload-artifact@v4
        with:
          name: oaa-plugin-${{ runner.os }}
          path: |
            oaa-plugin-*.tar.gz
            oaa-plugin-*.zip
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The website
  #
  # open-audio-analyzer.com is a static Astro site in `website/`, served by a
  # Cloudflare Worker configured in `wrangler.jsonc`. Until 0.11.0 it was
  # deployed by hand and nothing here touched it, which is exactly as reliable
  # as somebody remembering: the site reads the application's version out of
  # `pubspec.yaml` at build time, so it went stale at every tag until the next
  # `npm run deploy`. The GitHub Pages job that used to stand here published a
  # redirect per page for the documentation site this one replaced; those
  # redirects are already deployed and Pages goes on serving them, so nothing
  # has to keep publishing them.
  #
  # **Every event builds it, and that is the check.** The manual's page list in
  # `website/src/lib/docs.mjs` is written out rather than globbed — a glob
  # publishes `AGENTS.md` to strangers the day somebody moves it — so a renamed
  # document fails this build instead of quietly vanishing from the site.
  # `astro build` needs Node and nothing else.
  #
  # A push to main also builds the live analyzer and deploys. That half is a
  # Flutter web build of `website/tools/analyzer-demo`, which is the expensive
  # part and the reason the toolchain is set up for that event only. A site
  # built without it is complete rather than broken: the front page offers the
  # analyzer when `public/analyzer/` is there and simply does not when it is
  # not.
  #
  # **Building the site and deploying it are two jobs, and the second waits for
  # the release the first describes.** They were one, deploying on every push
  # to main and never on a tag, on the reasoning that a tag names a commit
  # already deployed and every download button points at `releases/latest`
  # rather than at a versioned filename. The button's *label* does not: it
  # prints the version out of `pubspec.yaml`, so the release commit's own push
  # to main deployed a front page reading "Download 0.15.0" while the newest
  # release was still 0.14.0 — and when the plugin job then failed, `publish`
  # never ran and the site went on saying it. Observed at 0.15.0.
  #
  # So the site deploys only over a release that exists: from a push to main
  # when `pubspec.yaml` names one already, and from a tag once `publish` has
  # actually published it. A release build whose artefacts fail deploys
  # nothing, which is the whole point — a site a version ahead of its
  # downloads is worse than a site a few minutes behind them.
  # -------------------------------------------------------------------------

  website:
    name: Website
    needs: checks
    runs-on: ubuntu-latest
    # Keyed by ref rather than global: a second push to main should win and the
    # first should be cancelled rather than racing it to the same bucket, and
    # one pull request's build has no business cancelling another's.
    concurrency:
      group: website-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      # That the site has the pages it claims to have. `astro build` fails on a
      # document the manifest names and the disk does not, which is the failure
      # that actually happens; this catches the other direction — a build that
      # succeeded and produced nothing, which has no error message at all.
      - name: Check the build has a site in it
        working-directory: website
        run: |
          for page in index 404 privacy docs/install docs/keyboard docs/metrics; do
            test -s "dist/$page.html"
          done
          test -s dist/sitemap.xml


  website-deploy:
    name: Deploy the website
    # `publish` is named so that a tag's deploy is ordered *after* the release
    # exists. It is skipped on a push to main, which is why every branch of the
    # condition below names the result it wants rather than relying on the
    # default "all needs succeeded" — that would skip this job on every push.
    needs: [website, publish]
    if: >-
      always()
      && github.event_name == 'push'
      && needs.website.result == 'success'
      && (
        (github.ref == 'refs/heads/main' && needs.publish.result == 'skipped')
        || (startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success')
      )
    runs-on: ubuntu-latest
    # Not keyed by ref, and not cancelled: two deploys of the same site race
    # each other whatever ref they came from, and a deploy killed half way is
    # the one state worse than a deploy that waited.
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The front page prints this version on its download button. A tag has
      # just published the matching release; a push to main may be the release
      # commit itself, whose release does not exist until the tag is pushed and
      # every artefact has built — and may never exist, if one of them fails.
      # Building anyway and stopping short of the deploy keeps this job honest
      # about *why* it did nothing.
      - name: The release the site would name
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Deploying: v$v is released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pubspec.yaml says $v and there is no v$v release yet, so the site would print \"Download $v\" over a releases page whose newest is older. Not deploying. Tag v$v and this same job deploys once publish has succeeded."
          fi

      - name: Install
        if: steps.release.outputs.exists == 'true'
        working-directory: website
        run: npm ci

      - uses: subosito/flutter-action@v2
        if: steps.release.outputs.exists == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `--no-still` because the still in front of the analyzer is committed and
      # is shot from a browser this runner does not have. The build itself is
      # what a deploy needs.
      - name: Build the live analyzer
        if: steps.release.outputs.exists == 'true'
        working-directory: website
        run: npm run analyzer -- --no-still

      - name: Build
        if: steps.release.outputs.exists == 'true'
        working-directory: website
        run: npm run build

      # Unset in a fork, and a fork should not fail for it — the same policy the
      # unsigned installers follow. `wrangler` reads the token out of the
      # environment; the account id comes with it because a token that can see
      # more than one account cannot guess which one this is.
      - name: Deploy
        if: steps.release.outputs.exists == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'No CLOUDFLARE_API_TOKEN: built the site and did not deploy it.'
            exit 0
          fi
          npx wrangler deploy

  # -------------------------------------------------------------------------
  # Installers. A tag, or a manual run.
  #
  # `needs: checks` on all of them: twenty minutes of packaging behind a commit
  # that does not analyse is twenty minutes nobody wanted. It is the fast job,
  # so the wait is small and the ordering is honest — an installer built from
  # code that fails its own tests is not a release candidate.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # The installers, and why they wait for the plugin job
  #
  # Each of the three carries the VST3 (and on macOS the Audio Unit) and
  # installs it behind a checkbox, so none of them can be built from the
  # application alone. They take the bundles the plugin job already produced
  # rather than building their own: a second JUCE build is fifteen minutes,
  # and on macOS a second notarisation of the same code — and two copies of a
  # binary that are supposed to be identical are two copies that can differ.
  #
  # The condition on each is the one the plugin job already had, so nothing
  # here costs a push anything. What it does cost is wall clock on a release:
  # the installers now start when the slowest JUCE build finishes.
  # -------------------------------------------------------------------------

  macos-pkg:
    name: macOS pkg
    needs: [checks, plugin]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: oaa-plugin-macOS
          path: plugin-artifact

      # The tarball holds VST3/ and AU/ at its root, which is the layout
      # make_pkg.sh's --plugins expects and the same one the build tree has.
      - name: Unpack the plug-ins
        run: |
          mkdir -p plugins
          tar -xzf plugin-artifact/oaa-plugin-macOS.tar.gz -C plugins
          ls -R plugins | head -20

      # Both identities are passed here, not just to the build. keychain.sh
      # verifies that the .p12 actually contains what these name, and this is
      # the only place it can — twenty minutes before productbuild would
      # otherwise be the first to notice.
      - name: Signing certificates
        env:
          OAA_SIGNING_CERTIFICATE: ${{ secrets.OAA_SIGNING_CERTIFICATE }}
          OAA_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OAA_SIGNING_CERTIFICATE_PASSWORD }}
          OAA_SIGNING_IDENTITY: ${{ secrets.OAA_SIGNING_IDENTITY }}
          OAA_INSTALLER_IDENTITY: ${{ secrets.OAA_INSTALLER_IDENTITY }}
        run: sh packaging/macos/keychain.sh

      # OAA_NOTARY_PROFILE is deliberately *not* here. It names an
      # `xcrun notarytool store-credentials` profile in a machine's keychain, so
      # a runner reading it finds nothing — which is how the `dmg` job this
      # one replaced read a notarisation secret for three releases and shipped
      # an unnotarised download without failing. The trio below is the form a
      # runner can be given; see packaging/macos/notarize.sh.
      - name: Build and package
        env:
          OAA_SIGNING_IDENTITY: ${{ secrets.OAA_SIGNING_IDENTITY }}
          OAA_INSTALLER_IDENTITY: ${{ secrets.OAA_INSTALLER_IDENTITY }}
          OAA_NOTARY_APPLE_ID: ${{ secrets.OAA_NOTARY_APPLE_ID }}
          OAA_NOTARY_TEAM_ID: ${{ secrets.OAA_NOTARY_TEAM_ID }}
          OAA_NOTARY_PASSWORD: ${{ secrets.OAA_NOTARY_PASSWORD }}
        run: sh packaging/macos/make_pkg.sh --plugins plugins

      - uses: actions/upload-artifact@v4
        with:
          name: oaa-macos-pkg
          path: build/packaging/*.pkg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: [checks, plugin]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: oaa-plugin-Windows
          path: plugin-artifact

      # The zip holds the .vst3 bundle at its root — the plugin job archives
      # the bundle rather than the directory containing it, so that nobody
      # unpacking it by hand gets MSVC's stray .lib and .exp as well. The
      # installer script wants the build tree's shape, so put it back.
      - name: Unpack the plug-in
        shell: pwsh
        run: Expand-Archive plugin-artifact\oaa-plugin-Windows.zip -DestinationPath plugins\VST3

      - name: Build and package
        shell: pwsh
        env:
          OAA_WINDOWS_CERT_BASE64: ${{ secrets.OAA_WINDOWS_CERT_BASE64 }}
          OAA_WINDOWS_CERT_PASS: ${{ secrets.OAA_WINDOWS_CERT_PASS }}
        run: pwsh packaging/windows/make_installer.ps1 -Plugins plugins

      - uses: actions/upload-artifact@v4
        with:
          name: oaa-windows-installer
          path: build/packaging/*.exe
          if-no-files-found: error

  linux-tarball:
    name: Linux tarball
    needs: [checks, plugin]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    # The same pin as the AppImage job and now as the plugin job. All three
    # ship binaries that have to start on the oldest distribution this
    # supports, and this one ships two of them in the same file.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - uses: actions/download-artifact@v4
        with:
          name: oaa-plugin-Linux
          path: plugin-artifact

      - name: Unpack the plug-in
        run: |
          mkdir -p plugins
          tar -xzf plugin-artifact/oaa-plugin-Linux.tar.gz -C plugins
          ls -R plugins | head -20

      - name: Build and package
        run: sh packaging/linux/make_installer.sh --plugins plugins

      - uses: actions/upload-artifact@v4
        with:
          name: oaa-linux-tarball
          path: build/packaging/*.tar.gz
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    # Pinned, and not to latest. See the header.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter's Linux embedder is GTK on GL; libasound is what miniaudio opens
      # a capture device through. Both are build-time as well as run-time.
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev \
            fuse libfuse2

      - name: Build and package
        run: sh packaging/linux/make_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: oaa-linux-appimage
          path: build/packaging/*.AppImage
          if-no-files-found: error

  linux-flatpak:
    name: Linux flatpak
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev \
            flatpak flatpak-builder appstream
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          # Fully qualified, and --noninteractive as well as -y. A partial ref
          # that matches more than one thing makes flatpak ask which one is
          # meant, and -y does not answer that question — it answers "is this
          # ok?". On a runner there is nobody to ask, so the step does not fail:
          # it waits. The 0.2.0 tag sat here for four hours before it was
          # cancelled, with every other installer already built.
          flatpak install -y --noninteractive --user flathub \
            runtime/org.freedesktop.Platform/x86_64/24.08 \
            runtime/org.freedesktop.Sdk/x86_64/24.08

      # Before the Flutter build, not after it. flatpak-builder ends with
      # `appstreamcli compose`, so a broken metainfo file is a failure that
      # arrives ten minutes into the job and reports a component id and an
      # error tag with no filename. This is the same check, in two seconds,
      # with an explanation.
      - name: Validate metainfo
        run: |
          appstreamcli validate --explain \
            packaging/linux/com.openaudioanalyzer.oaa.metainfo.xml

      - name: Build and package
        run: sh packaging/linux/make_flatpak.sh

      # `appstreamcli compose` prints "Refer to the generated issue report
      # data" and then discards it, so a compose failure says which component
      # and which tag and never which file. This prints the report, and the
      # composed output if there is any. Diagnosing it by re-reading the
      # manifest and guessing cost a release cycle.
      - name: AppStream report
        if: failure()
        run: |
          tree=build/packaging/flatpak-build/files
          if [ -d "$tree" ]; then
            appstreamcli compose --print-report=full --no-net \
              --components=com.openaudioanalyzer.oaa \
              --prefix=/ --origin=oaa \
              --result-root=/tmp/asc-result --data-dir=/tmp/asc-data \
              --icons-dir=/tmp/asc-icons "$tree" || true
            find "$tree/share" -name '*.desktop' -o -name '*.metainfo.xml' \
              -o -path '*icons*' -name '*.png' -o -name '*.svg' | sort
          else
            echo "no build tree at $tree"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oaa-linux-flatpak
          path: build/packaging/*.flatpak
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # `dart build cli`, not `dart compile exe`
  #
  # `dart compile` refuses a package whose dependencies have build hooks —
  # "'dart compile' does not support build hooks, use 'dart build' instead" —
  # and `oaa_engine` is exactly that. It refused on all three platforms the
  # first time the release workflow ever ran, which was the tag for 0.2.0,
  # because nothing else in the repository compiled the CLI: `cli/test` runs it
  # with `dart run`. The `engine` job builds it now for that reason.
  #
  # The product is therefore a directory rather than a file — `bin/oaa` beside
  # `lib/liboaa_engine.*` — and it is archived, because a release asset is a
  # flat list of files and an executable published next to its library as two
  # separate downloads is an executable that does not start.
  # -------------------------------------------------------------------------

  cli:
    name: oaa CLI
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: cli
        run: |
          dart pub get
          dart build cli -o build

      # Run what is about to be published, rather than trusting that a build
      # that exited 0 produced something that starts. It loads the engine
      # through the library beside it, so this also proves the bundle's own
      # layout.
      - name: Smoke
        if: runner.os != 'Windows'
        working-directory: cli
        run: ./build/bundle/bin/oaa --version

      - name: Smoke
        if: runner.os == 'Windows'
        working-directory: cli
        run: .\build\bundle\bin\oaa.exe --version

      # tar on Linux and macOS, zip on Windows, because a Windows user given a
      # .tar.gz has to know that tar has been in the OS since 2018.
      - name: Archive
        if: runner.os != 'Windows'
        working-directory: cli
        run: tar -czf "oaa-cli-${{ runner.os }}.tar.gz" -C build/bundle .

      - name: Archive
        if: runner.os == 'Windows'
        working-directory: cli
        shell: pwsh
        run: Compress-Archive -Path build\bundle\* -DestinationPath oaa-cli-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: oaa-cli-${{ runner.os }}
          path: |
            cli/oaa-cli-*.tar.gz
            cli/oaa-cli-*.zip
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The iPad build, which is the one artefact nobody downloads
  #
  # An App Store signature provisions no devices, so this IPA cannot be
  # sideloaded or handed to a tester — it can only be uploaded. It is therefore
  # built here, beside the other packagers, and *not* attached to the release;
  # the `publish` step below excludes it by name, because publishing an
  # installer that installs nothing is worse than publishing nothing.
  #
  # `publish` needs this job all the same. That is the whole point of the
  # ordering: if the iOS build cannot be signed, the release does not happen,
  # rather than happening and leaving TestFlight a version behind with nothing
  # to explain it.
  #
  # `keychain.sh` is the pkg's script, handed a different certificate. iOS App
  # Store distribution needs an **Apple Distribution** certificate; a Developer
  # ID signs a Mac app and is refused here. Two secrets rather than one for
  # that reason — the two certificates are not interchangeable and a single
  # secret name would invite exactly that mistake.
  # -------------------------------------------------------------------------

  ipa:
    name: iPad IPA
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: macos-latest
    outputs:
      built: ${{ steps.built.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Signing certificate
        env:
          OAA_SIGNING_CERTIFICATE: ${{ secrets.OAA_IOS_CERTIFICATE }}
          OAA_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OAA_IOS_CERTIFICATE_PASSWORD }}
        run: sh packaging/macos/keychain.sh

      # OAA_BUILD_NUMBER is the run counter and not `pubspec.yaml`'s `+N`.
      # TestFlight refuses a build number it has seen before for the same
      # version string, and it refuses it at the end of the upload — which here
      # is after the release has been published. The run counter only ever
      # increases; see the header of make_ipa.sh.
      - name: Build and sign
        env:
          OAA_IOS_PROFILE: ${{ secrets.OAA_IOS_PROFILE }}
          OAA_IOS_TEAM_ID: ${{ secrets.OAA_IOS_TEAM_ID }}
          OAA_IOS_SIGNING_IDENTITY: ${{ secrets.OAA_IOS_SIGNING_IDENTITY }}
          OAA_BUILD_NUMBER: ${{ github.run_number }}
        run: sh packaging/ios/make_ipa.sh

      # Whether anything was built is a job output, and `testflight` is gated on
      # it. Without that gate, a tag in a repository with no iOS secrets fails:
      # this job succeeds having produced nothing, no artefact is created, and
      # `download-artifact` errors on a name that does not exist — turning a
      # release that went out perfectly well into a red run. A skipped job says
      # what happened; a failed download says something is broken.
      - name: Built?
        id: built
        run: |
          if ls build/packaging/*.ipa >/dev/null 2>&1; then
            echo 'built=true' >>"$GITHUB_OUTPUT"
          else
            echo 'built=false' >>"$GITHUB_OUTPUT"
            echo 'No IPA: the iOS signing secrets are not set. Nothing to upload.'
          fi

      # `ignore` rather than `error`, unlike every other packaging job. An App
      # Store IPA cannot be produced unsigned, so a fork and a run without the
      # secrets produce no file at all rather than an unusable one, and neither
      # is a failure. The step above is what turns that into a decision.
      - uses: actions/upload-artifact@v4
        if: steps.built.outputs.built == 'true'
        with:
          name: testflight-ipa
          path: build/packaging/*.ipa
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The Android bundle
  #
  # The same two-job shape as `ipa` and `testflight`, for the same reason: a
  # Play version code, once accepted, can never be reused or lowered, so the
  # upload happens after the release exists. `android-aab` builds beside the
  # other packagers; `play-store` uploads, at the very end.
  #
  # Where it differs from `ipa` is what a run with no secrets does. An App
  # Store export with no signature is not an unsigned IPA, it is a failed
  # export — so `make_ipa.sh` produces nothing. An Android release build with
  # no upload key *succeeds*: Gradle falls back to the debug key, which is what
  # keeps `flutter run --release` working for a developer who has never seen
  # the credential. So this builds either way and `make_aab.sh` declines to
  # hand over what it built, which is worth having on its own — Android is
  # otherwise compiled nowhere in this workflow, and a dispatch is the only
  # thing standing between that build and six weeks of quiet rot.
  #
  # `setup-java` is explicit rather than left to the image's default JDK. The
  # image ships several, `JAVA_HOME` moves when the runner label is bumped, and
  # AGP fails on the wrong one with a message about an unsupported class file
  # version that names no toolchain.
  # -------------------------------------------------------------------------

  android-aab:
    name: Android bundle
    needs: checks
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.asc_notes_build == '')
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.built.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # OAA_BUILD_NUMBER is the run counter, and it is the same argument the
      # iPad build makes: Play refuses a version code it has already accepted,
      # refuses it during the upload — which here is after the release has been
      # published — and never lets it be lowered afterwards. `pubspec.yaml`'s
      # `+N` is maintained by hand and collides on a re-run of a tag.
      - name: Build and sign
        env:
          OAA_ANDROID_KEYSTORE: ${{ secrets.OAA_ANDROID_KEYSTORE }}
          OAA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OAA_ANDROID_KEYSTORE_PASSWORD }}
          OAA_ANDROID_KEY_ALIAS: ${{ secrets.OAA_ANDROID_KEY_ALIAS }}
          OAA_ANDROID_KEY_PASSWORD: ${{ secrets.OAA_ANDROID_KEY_PASSWORD }}
          OAA_BUILD_NUMBER: ${{ github.run_number }}
        run: sh packaging/android/make_aab.sh

      # Whether anything was offered is a job output, and `play-store` is gated
      # on it — the same gate `testflight` has and for the same failure. Without
      # it, a tag in a repository with no Android secrets succeeds here having
      # produced nothing, no artefact is created, and `download-artifact` errors
      # on a name that does not exist: a release that went out perfectly well
      # turns red on a step that has nothing to do with it.
      - name: Built?
        id: built
        run: |
          if ls build/packaging/*.aab >/dev/null 2>&1; then
            echo 'built=true' >>"$GITHUB_OUTPUT"
          else
            echo 'built=false' >>"$GITHUB_OUTPUT"
            echo 'No bundle offered: the Android signing secrets are not set.'
          fi

      # `ignore` rather than `error`, as for the IPA. A debug-signed bundle is
      # discarded rather than uploaded, so a fork produces no file and that is
      # the correct outcome, not a failure.
      - uses: actions/upload-artifact@v4
        if: steps.built.outputs.built == 'true'
        with:
          name: play-store-aab
          path: build/packaging/*.aab
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The release
  #
  # `needs` names the test jobs as well as the packaging ones, which is the
  # thing three separate workflows could not express: a tag cannot publish a
  # release from a commit whose tests are red.
  # -------------------------------------------------------------------------

  publish:
    name: Publish
    needs: [checks, engine, plugin, macos-pkg, windows-installer, linux-tarball,
            linux-appimage, linux-flatpak, cli, ipa, android-aab]
    runs-on: ubuntu-latest
    # Only a tag becomes a release. A manual run is a check that the scripts
    # still work, and it leaves its artefacts on the run rather than publishing
    # a release nobody asked for.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The notes are this tag's own changelog section, found by version rather
      # than by position. Taking the first section instead would take
      # `## [Unreleased]`, which is empty on a release commit by construction —
      # so the release would have published no notes at all and nothing would
      # have failed. An empty extraction is an error here for the same reason.
      - name: Notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi

      # The asset list is NUL-delimited into an array, not interpolated. Every
      # installer is named "Open Audio Analyzer-<version>-...", and
      # `$(find ...)` splits that on the spaces: the first tag to reach this
      # step died on `no matches found for artifacts/oaa-linux-appimage/Open`,
      # with all seven builds green and nothing else left to do.
      #
      # One artefact is excluded: a file on a release page is a file somebody
      # will download, and `testflight-ipa` is not one they could use. It is an
      # App Store IPA, it provisions no devices, and it exists to be uploaded,
      # which the job after this does.
      #
      # It is excluded by path rather than the download being narrowed to a
      # pattern, deliberately: `download-artifact` with no `name` takes every
      # artefact in the run rather than the ones this job's `needs` lists, so a
      # future artefact nobody thought about is attached rather than silently
      # left off the release. That policy has fired once — the documentation
      # site's `artifact.tar` rode along on v0.3.0 through v0.6.0, because
      # `upload-pages-artifact` always names its payload that — and attaching
      # one file too many is the failure it was chosen for.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
            echo "attaching $file"
          done < <(find artifacts -type f \
            -not -path 'artifacts/testflight-ipa/*' \
            -not -path 'artifacts/play-store-aab/*' -print0 | sort -z)
          [ "${#assets[@]}" -gt 0 ] || { echo 'no artefacts to attach' >&2; exit 1; }
          # The title is the tag and nothing else — `v0.12.0`, not
          # "Open Audio Analyzer v0.12.0". The repository's name is already
          # above every release on the page, in the breadcrumb and in the
          # feed, so the prefix is repeated three times per row and pushes the
          # version — the one thing a reader is scanning for — to the right.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${assets[@]}"

  # -------------------------------------------------------------------------
  # TestFlight, after the release and not before it
  #
  # `needs: publish`, which is the ordering the whole iOS path is arranged
  # around. `xcodebuild -exportArchive` can upload as it exports, and using
  # that would have put the upload in the `ipa` job — before the other
  # installers had finished, before the release existed, and with no way to
  # undo it if a later job went red. A build sitting in TestFlight for a
  # version that was never released is a state nothing else here can produce
  # and nobody can clean up.
  #
  # So the IPA travels as an artefact and this job is the last thing in the
  # file. `publish` only runs on a tag, so this only runs on a tag: a manual
  # dispatch builds and signs the IPA and stops there, which is the check that
  # the signing works without spending a TestFlight build number on it.
  #
  # It does not wait for App Store Connect to finish processing. Processing
  # takes minutes to an hour, it happens after the upload has been accepted,
  # and a workflow that held a runner open for it would be paying for a
  # progress bar.
  # -------------------------------------------------------------------------

  testflight:
    name: TestFlight
    # `publish` for the ordering, `ipa` for its output — `publish` already needs
    # `ipa`, so this adds a name to read and not a wait.
    needs: [publish, ipa]
    if: startsWith(github.ref, 'refs/tags/v') && needs.ipa.outputs.built == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: testflight-ipa
          path: build/packaging

      # An App Store Connect API key, not an Apple ID. The same distinction
      # `notarize.sh` documents: an Apple ID plus an app-specific password
      # authenticates a person, and a person has agreements to accept, so it
      # fails on a runner as though the credential were wrong. The key belongs
      # to the team and needs the App Manager role.
      - name: Upload
        env:
          OAA_ASC_KEY_ID: ${{ secrets.OAA_ASC_KEY_ID }}
          OAA_ASC_ISSUER_ID: ${{ secrets.OAA_ASC_ISSUER_ID }}
          OAA_ASC_KEY: ${{ secrets.OAA_ASC_KEY }}
        run: sh packaging/ios/testflight.sh

  # -------------------------------------------------------------------------
  # Google Play, after the release and not before it
  #
  # `needs: publish`, for the reason `testflight` has and one more. An upload
  # to App Store Connect cannot be withdrawn; a Play upload cannot be withdrawn
  # *and* it consumes a version code permanently — Play will never accept that
  # number again, on any track, and will never accept a lower one. So a failed
  # release that had already uploaded would not merely leave a build behind, it
  # would burn the number the retry wanted.
  #
  # The bundle therefore travels from `android-aab` as an artefact and this is
  # the last thing in the file. `publish` only runs on a tag, so this only runs
  # on a tag: a manual dispatch builds and signs the bundle and stops there,
  # which is the check that the upload key works without spending a version
  # code on it.
  #
  # The track is a repository *variable* rather than a secret, because it is
  # not one — it is a routing decision somebody should be able to read off the
  # settings page and change without editing this file. Unset, the script
  # sends to `internal`, which is Play's nearest thing to TestFlight and the
  # only default under which a mistake is cheap. Promoting a build to
  # production stays a deliberate act in the Console.
  #
  # It does not wait for Play to finish processing the bundle, for the same
  # reason `testflight` does not: that happens after the upload is accepted and
  # a workflow holding a runner open for it would be paying for a progress bar.
  # -------------------------------------------------------------------------

  play-store:
    name: Play Store
    # `publish` for the ordering, `android-aab` for its output — `publish`
    # already needs `android-aab`, so this adds a name to read and not a wait.
    needs: [publish, android-aab]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android-aab.outputs.built == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: play-store-aab
          path: build/packaging

      # A service account, not a Google account. The same distinction
      # `testflight.sh` documents for App Store Connect: a person's account has
      # a password, a second factor and consent screens, so it fails on a
      # runner as though the credential were wrong. The account needs the
      # Release manager role granted in the Play Console — a Cloud IAM role is
      # a different thing and is not enough on its own.
      - name: Upload
        env:
          OAA_PLAY_SERVICE_ACCOUNT: ${{ secrets.OAA_PLAY_SERVICE_ACCOUNT }}
          OAA_PLAY_TRACK: ${{ vars.OAA_PLAY_TRACK }}
          OAA_PLAY_STATUS: ${{ vars.OAA_PLAY_STATUS }}
        run: sh packaging/android/play_store.sh

  # -------------------------------------------------------------------------
  # The store notes, written onto a build that already exists
  #
  # `testflight.sh` writes What to Test and What's New after every upload, and
  # until this job the only way to find out whether that worked was to upload:
  # a tag, a build number spent, and a refusal arriving after the release was
  # already published. This is the same two code paths with the upload taken
  # out — it names a build App Store Connect already has and writes onto it.
  #
  # `OAA_ASC_NOTES_WAIT` is 0 because there is nothing to wait for. That wait
  # exists for the minutes after an upload, while Apple turns bytes into a
  # build resource; a build named by hand was processed long ago.
  #
  # **ubuntu, not macOS.** This needs python3, openssl and the network, and
  # none of altool, xcrun or a Mac — it is the only thing in this file that
  # reaches App Store Connect without one, and the cheapest runner there is.
  #
  # It **fails the run** when Apple refuses something, which is the whole
  # point. The same refusal inside `testflight.sh` is a warning, because there
  # a note is not worth failing an upload Apple has already accepted; here the
  # answer *is* the product.
  # -------------------------------------------------------------------------

  asc-notes:
    name: Store notes
    if: github.event_name == 'workflow_dispatch' && inputs.asc_notes_build != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write
        env:
          OAA_ASC_KEY_ID: ${{ secrets.OAA_ASC_KEY_ID }}
          OAA_ASC_ISSUER_ID: ${{ secrets.OAA_ASC_ISSUER_ID }}
          OAA_ASC_KEY: ${{ secrets.OAA_ASC_KEY }}
          OAA_ASC_NOTES_WAIT: '0'
          BUILD: ${{ inputs.asc_notes_build }}
        run: |
          set -eu
          if [ -z "${OAA_ASC_KEY:-}" ]; then
            echo "==> no App Store Connect key; nothing to write."
            exit 0
          fi
          keys="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys"
          chmod 700 "$keys"
          printf '%s' "$OAA_ASC_KEY" | base64 --decode \
            >"$keys/AuthKey_$OAA_ASC_KEY_ID.p8"
          version=$(grep '^version:' pubspec.yaml | head -1 |
            cut -d' ' -f2 | cut -d'+' -f1)
          echo "==> notes for $version onto build $BUILD"
          notes=$(python3 packaging/store_notes.py CHANGELOG.md "$version" 4000)
          python3 packaging/ios/asc_notes.py \
            "$keys/AuthKey_$OAA_ASC_KEY_ID.p8" com.openaudioanalyzer.oaa \
            "$BUILD" "$version" "$notes"
