# SPDX-License-Identifier: GPL-3.0-or-later
#
# Two jobs, split by what they actually need.
#
# `checks` runs the cheap, broad signals first. The domain tests genuinely need
# no C toolchain — `oaa_core` depends on nothing — so they run before anything
# that compiles, and a domain regression is diagnosed without waiting on a
# native build. The widget tests come after and *do* build the engine, because
# the app depends on `oaa_engine`; there is no way around that and no reason to
# want one.
#
# `engine` compiles the C through the build hook and runs the meters against
# arithmetic on all three desktop platforms. It needs no audio hardware: the
# built-in test tone is what makes the engine testable on a headless runner.
# Running all three matters — the POSIX feature-test macro bug that broke the
# first CI run was invisible on Windows and on the development machine.
#
# From Phase 1 this file also runs the EBU R128 conformance vectors, and a red
# conformance run blocks the release. See docs/METRICS.md.
#
# Two other workflows sit beside this one and are deliberately not part of it:
# `docs.yml` builds and publishes the documentation site, and `release.yml`
# builds the four installers. Both are an order of magnitude slower than this
# file and answer a question nobody asked on the commit being pushed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pinned to the same version as .tool-versions. Keep the two in step; a CI that
# passes on a different Flutter than everybody develops against is worse than
# no CI.
env:
  FLUTTER_VERSION: 3.44.5

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Domain tests
        working-directory: packages/oaa_core
        run: |
          dart pub get
          dart test

      # The remote display's protocol, including the golden that holds this
      # implementation against the C++ producer byte for byte. Pure Dart, so it
      # runs beside the domain tests and needs no toolchain — three
      # implementations of docs/WIRE.md agreeing is the entire point of having
      # written it down.
      - name: Wire protocol tests
        working-directory: packages/oaa_wire
        run: |
          dart pub get
          dart test

      # The engine has two build descriptions — hook/build.dart for the app and
      # engine/CMakeLists.txt for the plugin — and somebody adding a source file
      # will eventually add it to one. The failure that produces is an undefined
      # symbol at link time in whichever consumer was forgotten, usually on a
      # platform the author was not building. This turns it into a one-line diff.
      - name: Engine source lists agree
        run: sh plugin/test/sources_match.sh

      - name: Widget tests
        run: flutter test

  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Compiles engine/src through hook/build.dart and exercises the meters
      # against the test tone. A sine of amplitude A peaks at A and has an RMS
      # of A/sqrt(2) — if those drift, the meters are wrong, not the tone.
      # Includes the EBU Tech 3341/3342 conformance cases. A red conformance
      # run is a red build: these numbers are what users deliver against.
      - name: Engine and conformance tests
        working-directory: packages/oaa_engine
        run: |
          dart pub get
          dart test

      # Runs the real `oaa` binary as a subprocess and asserts on its exit
      # codes. On all three platforms because file decoding is where they
      # differ most: Windows takes a UTF-16 path, and a filename with an umlaut
      # in it fails there and nowhere else.
      - name: CLI tests
        working-directory: cli
        run: |
          dart pub get
          dart test

      # `cli/test` runs the CLI with `dart run`, so nothing here built it the
      # way a release does until this step existed — and `dart compile exe`
      # had stopped working entirely, because it refuses a package with build
      # hooks and `oaa_engine` has one. That was found by tagging 0.2.0 and
      # watching all three CLI jobs fail. The build is the gate; running the
      # result is what proves the bundle's layout, since the executable loads
      # the engine from the library beside it.
      - name: CLI builds and starts
        working-directory: cli
        run: dart build cli -o build

      - name: CLI builds and starts (run)
        if: runner.os != 'Windows'
        working-directory: cli
        run: ./build/bundle/bin/oaa --version

      - name: CLI builds and starts (run)
        if: runner.os == 'Windows'
        working-directory: cli
        run: .\build\bundle\bin\oaa.exe --version
