# SPDX-License-Identifier: GPL-3.0-or-later
#
# The documentation site, built and published to GitHub Pages.
#
# ---------------------------------------------------------------------------
# It builds on every pull request and publishes only from main
#
# The pages are generated from Markdown that lives beside the code —
# docs/METRICS.md and docs/WIRE.md are normative documents held by tests — so a
# change that breaks the site is a change to the repository's documentation,
# and the place to find out is the pull request rather than after the merge.
# `tool/docs.dart` exits non-zero when a page it is asked to publish does not
# exist, which is the failure that actually happens: somebody renames a
# document and the site loses a page silently.
#
# Publishing is a separate job so that a fork's pull request, which has no
# Pages permission, builds and does not try to deploy.
#
# There is no Flutter here. `tool/docs.dart` imports nothing but `dart:io` and
# `dart:convert` on purpose, so this job is a Dart SDK and forty seconds.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push while the first is deploying should win, and the first should
  # be cancelled rather than racing it to the same bucket.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate
        run: dart run tool/docs.dart --out build/docs

      # The keyboard page is generated from the shortcut table in the
      # application, and `flutter test` is what proves it is not stale. Saying
      # so here means somebody reading this file knows the check exists and is
      # somewhere else, rather than assuming this job covers it.
      - name: Check every page was written
        run: |
          test -s build/docs/index.html
          test -s build/docs/keyboard.html
          test -s build/docs/metrics.html
          test -s build/docs/wire.html
          test -s build/docs/style.css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    name: Publish
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
