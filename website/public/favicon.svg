<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPDX-License-Identifier: GPL-3.0-or-later

  The application's mark, with the icon's rounded square taken off.

  packaging/icon/make_icons.dart draws the mark in white on a teal ground,
  which is what an app icon needs and the wrong thing for a browser tab: at
  16 px the ground is most of what you see, and the waveform inside it is four
  grey pixels. Here the ground is gone, the viewBox is cropped to the mark
  itself (measured: 129,280 767x464 in the original 1024 square) so it fills
  the tab, and the strokes carry the signal colour rather than white, which
  survives both a light and a dark tab bar.

  Keep runs of hyphens out of any comment added here. Two in a row end an XML
  comment and every renderer that loads the file through an img element then
  shows a broken image with no error anywhere.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="106 105 813 813"
     width="813" height="813" role="img" aria-labelledby="oaa-icon-title">
  <title id="oaa-icon-title">Open Audio Analyzer</title>
