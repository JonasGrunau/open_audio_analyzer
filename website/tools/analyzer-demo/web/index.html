<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    This document is served at /analyzer/index.html and the front page loads it
    into an iframe. It is also, therefore, a real crawlable URL — and it shipped
    for four releases as the Flutter scaffold wrote it: titled
    `oaa_analyzer_demo`, described as "A new Flutter project.", with no `lang`
    and no viewport. That is what a search engine had to work with, and it is a
    worse description of this project than no page at all.

    `noindex` rather than a `Disallow:` in robots.txt, which is the mistake that
    looks like the fix: a disallowed URL is never fetched, so the refusal below
    is never read, and the address can stay in the index on the strength of a
    link to it. Crawling has to be allowed for a noindex to work.
  -->
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="The live Open Audio Analyzer canvas, replaying a real track measured by the engine. Loaded by open-audio-analyzer.com.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Open Audio Analyzer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Live analyzer — Open Audio Analyzer</title>
  <link rel="manifest" href="manifest.json">
<style>
    /* The application's own background, on the document itself.
       An iframe paints its blank document white before anything of Flutter's
       exists, so the page it is swapped into flashed white for the moment
       between the load event and the first frame. Nothing here waits on
       CanvasKit, so it is the first thing painted. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0c0e;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
